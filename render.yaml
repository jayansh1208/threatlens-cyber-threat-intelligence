services:
  - type: web
    name: threatlens-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: threatlens
      - key: FRONTEND_ORIGINS
        sync: false
